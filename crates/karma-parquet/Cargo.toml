[package]
name = "karma-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A Parquet-backed karma-index TableProvider — skips row-group I/O using a Puffin sidecar (zone map + bloom)."

[dependencies]
# datafusion re-exports the version-matched `arrow` and `parquet` (incl. the C
# `zstd-sys`), so we pull neither directly — avoids an arrow/parquet version skew.
datafusion = "54.0.0"
# We depend on `parquet` directly ONLY to turn on its async object-store reader; the
# version is pinned to exactly what datafusion pulls (58.3.0), so cargo unifies to a
# single instance and `datafusion::parquet` gains these features too. `object_store` is
# likewise pinned to datafusion's version.
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "async", "object_store"] }
object_store = { version = "0.13.2", features = ["aws"] }  # `aws` = the AmazonS3Builder (R2/S3)
futures = "0.3"
karma-index = { path = "../karma-index" }
karma-datafusion = { path = "../karma-datafusion" }
async-trait = "0.1"
thiserror = { workspace = true }
# The Iceberg REST catalog client (Lakekeeper) — OPTIONAL: only the `rest-catalog`
# feature pulls it, so the default build stays lean. We use it purely to resolve a
# table to its data-file paths; the reading is karma-parquet's.
iceberg = { version = "0.9", optional = true }
iceberg-catalog-rest = { version = "0.9", optional = true }

[features]
# Resolve tables via an Iceberg REST catalog (Lakekeeper). Off by default.
rest-catalog = ["dep:iceberg", "dep:iceberg-catalog-rest"]

[dev-dependencies]
# `bytes` is only used by the instrumented ChunkReader in the read-path test.
bytes = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
