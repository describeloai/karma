[package]
name = "karma-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Karma SQL engine HTTP server — POST /sql over the Iceberg warehouse (ml-runner catalog + R2)."

[[bin]]
name = "karma-server"
path = "src/main.rs"

[dependencies]
karma-sql = { path = "../karma-sql" }
karma-parquet = { path = "../karma-parquet" }
datafusion = "54.0.0"
axum = "0.7"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }      # already in the tree via object_store
object_store = { version = "0.13.2", features = ["aws"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
